<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Motoca Premium — gerar código pra teste</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #0d1117; color: #e6edf3; text-align: center; }
  h1 { font-size: 18px; }
  p.aviso { color: #9aa4af; font-size: 13px; }
  input { width: 300px; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; text-align: center; font-size: 18px; }
  button { margin-left: 8px; padding: 10px 16px; border-radius: 8px; border: none; background: #2f81f7; color: white; font-weight: bold; cursor: pointer; }
  .caixa-branca { background: white; padding: 24px; border-radius: 12px; margin-top: 24px; display: inline-flex; }
</style>
</head>
<body>
  <h1>Gerar código pra teste (QR)</h1>
  <p class="aviso">Código de barras de tela dá muito problema de leitura (moiré) — usando QR aqui só pro teste local, o app lê qualquer tipo de código igual.</p>
  <p class="aviso">Dica: tela no brilho máximo, uns 15-20cm de distância, reto pro monitor.</p>

  <div>
    <input id="valor" type="text" value="9001" />
    <button onclick="gerar()">Gerar</button>
  </div>

  <div class="caixa-branca" id="qrcode"></div>

<script>
  let qr = null;
  function gerar() {
    const valor = document.getElementById('valor').value.trim();
    document.getElementById('qrcode').innerHTML = '';
    qr = new QRCode(document.getElementById('qrcode'), {
      text: valor,
      width: 260,
      height: 260,
      correctLevel: QRCode.CorrectLevel.M,
    });
  }
  gerar();
</script>
</body>
</html>
