<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Motoca Premium — pegar ID token (uso local, dev)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; background: #0d1117; color: #e6edf3; }
  h1 { font-size: 18px; }
  p.aviso { color: #9aa4af; font-size: 13px; }
  label { display: block; margin-top: 14px; font-size: 14px; }
  input { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; box-sizing: border-box; }
  button { margin-top: 18px; padding: 10px 16px; border-radius: 8px; border: none; background: #2f81f7; color: white; font-weight: bold; cursor: pointer; }
  textarea { width: 100%; height: 110px; margin-top: 10px; background: #161b22; color: #7ee787; border: 1px solid #30363d; border-radius: 8px; padding: 8px; font-family: monospace; font-size: 12px; }
  .erro { color: #ff7b72; margin-top: 10px; font-size: 13px; }
  .uid { color: #9aa4af; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Pegar ID token do Firebase (uso local)</h1>
  <p class="aviso">
    Ferramenta local só pra desenvolvimento/teste do backend. Sua senha vai
    direto pro Firebase (identitytoolkit.googleapis.com) por HTTPS — nunca é
    salva ou enviada a mais nenhum lugar por esta página. Não publique este
    arquivo em nenhum lugar.
  </p>

  <label>Email</label>
  <input id="email" type="email" placeholder="seu@email.com" />

  <label>Senha</label>
  <input id="senha" type="password" placeholder="••••••••" />

  <button onclick="login()">Entrar e gerar token</button>

  <div id="erro" class="erro"></div>
  <div id="uidBox" class="uid"></div>
  <textarea id="tokenBox" readonly placeholder="O ID token aparece aqui depois do login..."></textarea>

<script>
  // Mesmo apiKey usado pelo app Flutter (lib/firebase_options.dart) — API key
  // do Firebase não é segredo, é seguro expor em cliente.
  const API_KEY = "AIzaSyBt7tXHmxBQdGGXr2vLJInapUcWcwSuz2A";

  async function login() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const erroEl = document.getElementById("erro");
    const uidEl = document.getElementById("uidBox");
    const tokenEl = document.getElementById("tokenBox");
    erroEl.textContent = "";
    uidEl.textContent = "";
    tokenEl.value = "";

    if (!email || !senha) {
      erroEl.textContent = "Preencha email e senha.";
      return;
    }

    try {
      const resp = await fetch(
        `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password: senha, returnSecureToken: true }),
        },
      );
      const data = await resp.json();
      if (!resp.ok) {
        erroEl.textContent = "Erro: " + (data.error?.message || resp.status);
        return;
      }
      uidEl.textContent = "uid: " + data.localId;
      tokenEl.value = data.idToken;
    } catch (e) {
      erroEl.textContent = "Falha de rede: " + e;
    }
  }
</script>
</body>
</html>
